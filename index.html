<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>V.O.W. - Very Optimized Worker</title><style>
:root{--bg:#090a0c;--panel:#111318;--ink:#edf0e9;--muted:#737a77;--line:#252a2b;--acid:#caff4a;--blue:#76d6ff;--warm:#ffbf69}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--ink);font:14px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;min-height:100vh}button,input,textarea{font:inherit}.shell{max-width:1180px;margin:auto;padding:38px 24px 80px}header{display:flex;justify-content:space-between;gap:20px;align-items:flex-start;margin-bottom:34px}.brand{font-size:clamp(28px,5vw,62px);font-weight:900;letter-spacing:-.07em;line-height:.9}.brand i{font-style:normal;color:var(--acid)}.tag{color:var(--muted);margin-top:10px}.date{text-align:right;color:var(--muted);font-size:12px;letter-spacing:.15em;text-transform:uppercase}.score{color:var(--acid);font-size:22px;margin-top:5px}.grid{display:grid;grid-template-columns:1.08fr .92fr;gap:18px}.panel{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:20px;min-width:0}.panel h2{font-size:11px;letter-spacing:.18em;text-transform:uppercase;color:var(--muted);margin:0 0 18px}.capture{grid-column:1/-1;display:flex;gap:10px;background:#0d0f12;padding:12px;border:1px solid var(--line);border-radius:14px}.capture input{flex:1;background:transparent;border:0;outline:0;color:var(--ink);padding:8px}.capture button,.add,.complete{border:0;border-radius:9px;background:var(--acid);color:#111;padding:10px 14px;font-weight:800;cursor:pointer}.item{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start;padding:13px 0;border-top:1px solid var(--line)}.item:first-of-type{border-top:0}.check{width:19px;height:19px;border-radius:6px;border:1px solid #4d5554;background:transparent;color:#111;cursor:pointer}.item.done .check{background:var(--acid);border-color:var(--acid)}.item.done .text{text-decoration:line-through;color:var(--muted)}.text{overflow-wrap:anywhere}.meta{display:flex;gap:7px;margin-top:5px;flex-wrap:wrap}.pill{font-size:10px;border:1px solid var(--line);border-radius:20px;padding:2px 7px;color:var(--muted)}.pill.today{color:var(--warm)}.pill.deep{color:var(--blue)}.del{background:transparent;border:0;color:#4e5654;cursor:pointer;font-size:17px}.empty{color:var(--muted);padding:24px 0}.progress{height:6px;background:#22272a;border-radius:9px;overflow:hidden;margin-bottom:18px}.progress span{display:block;height:100%;background:var(--acid);transition:.3s}.goal{padding:15px 0;border-top:1px solid var(--line)}.goal:first-of-type{border-top:0}.goal-top{display:flex;justify-content:space-between;gap:10px}.goal-name{font-weight:800}.goal small{color:var(--muted)}.bar{height:4px;background:#292d30;margin:10px 0 8px;border-radius:9px}.bar i{display:block;height:100%;background:var(--blue);border-radius:9px}.goal-actions{display:flex;gap:6px}.goal-actions button{background:#1a1e22;color:var(--ink);border:1px solid var(--line);border-radius:7px;padding:5px 9px;cursor:pointer}.vow{margin-top:18px;border:1px solid #3a451d;background:#11150a}.vow blockquote{margin:0;font-size:18px;line-height:1.45;color:#e9f6c7}.vow .prompt{color:var(--acid);font-size:11px;letter-spacing:.12em;margin-bottom:12px}.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:18px}.stat{padding:12px;background:#0c0e11;border-radius:10px}.stat b{display:block;font-size:20px}.stat span{color:var(--muted);font-size:10px;text-transform:uppercase}.modal{position:fixed;inset:0;background:#000b;display:none;place-items:center;padding:20px}.modal.on{display:grid}.card{width:min(520px,100%);background:#15181c;border:1px solid #353b3d;border-radius:18px;padding:22px}.card input,.card textarea,.card select{width:100%;margin:7px 0 12px;background:#0c0e11;color:var(--ink);border:1px solid var(--line);border-radius:9px;padding:11px}.card textarea{height:76px;resize:vertical}.row{display:flex;justify-content:flex-end;gap:8px}.row button{padding:9px 13px;border-radius:8px;border:1px solid var(--line);background:#202428;color:var(--ink);cursor:pointer}.row .save{background:var(--acid);color:#111;border:0}.hint{font-size:11px;color:var(--muted)}@media(max-width:760px){.grid{grid-template-columns:1fr}.shell{padding:24px 14px 60px}.date{display:none}.capture{grid-column:auto}.brand{font-size:43px}}
</style></head><body><main class="shell"><header><div><div class="brand">V.<i>O</i>.W.</div><div class="tag">very optimized worker / obligations without the overhead</div></div><div class="date" id="date"></div></header><div class="grid"><form class="capture" id="capture"><input id="quick" autocomplete="off" placeholder="Dump an obligation, habit, promise, or idea…"><button>CAPTURE ↵</button></form><section class="panel"><h2>NOW / Obligations</h2><div class="progress"><span id="taskbar"></span></div><div id="tasks"></div></section><section class="panel"><h2>TRAJECTORIES / Abstract goals</h2><div id="goals"></div><button class="add" id="addGoal">+ NEW TRAJECTORY</button></section><section class="panel vow"><div class="prompt">TODAY'S VOW</div><blockquote id="vowText"></blockquote><div class="stats"><div class="stat"><b id="doneN">0</b><span>cleared</span></div><div class="stat"><b id="streak">1</b><span>day rhythm</span></div><div class="stat"><b id="openN">0</b><span>open loops</span></div></div></section><section class="panel"><h2>THE WORKER'S NOTE</h2><div id="note" contenteditable="true" style="min-height:110px;outline:0;color:#c9ceca" data-placeholder="What would make today count?"></div><div class="hint" style="margin-top:14px">Saved locally. No account. No cloud. Your head gets the space back.</div></section></div></main><div class="modal" id="modal"><form class="card" id="goalForm"><h2>New trajectory</h2><label>Name<input id="gname" required placeholder="Become conversational in Japanese"></label><label>Why it matters<textarea id="gwhy" placeholder="The deeper reason, not a deadline"></textarea></label><label>First proof of motion<input id="gstep" placeholder="20 minutes of listening"></label><div class="row"><button type="button" id="cancel">CANCEL</button><button class="save">START</button></div></form></div><script>
const K='vow-state-v1',defaults={tasks:[{id:1,text:'Send the proposal I keep rewriting',done:false,kind:'obligation'},{id:2,text:'Walk for 20 minutes',done:false,kind:'habit'},{id:3,text:'Write one ugly page',done:true,kind:'practice'}],goals:[{id:4,name:'Build a body of work',why:'Make ideas real instead of precious.',step:'Ship one small artifact',p:34},{id:5,name:'Be more present',why:'Attention is how I show care.',step:'Phone down at dinner',p:18}],note:''};let S;try{S=JSON.parse(localStorage.getItem(K))||defaults}catch(e){S=defaults}const $=s=>document.querySelector(s);function save(){localStorage.setItem(K,JSON.stringify(S))}function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function render(){let done=S.tasks.filter(x=>x.done).length;$('#tasks').innerHTML=S.tasks.length?S.tasks.map(t=>`<div class="item ${t.done?'done':''}" data-id="${t.id}"><button class="check">${t.done?'✓':''}</button><div><div class="text">${esc(t.text)}</div><div class="meta"><span class="pill ${t.kind==='habit'?'deep':'today'}">${t.kind}</span>${!t.done?'<span class="pill">open loop</span>':''}</div></div><button class="del">×</button></div>`).join(''):'<div class="empty">Head clear. Add what is pulling at you.</div>';$('#taskbar').style.width=(S.tasks.length?done/S.tasks.length*100:0)+'%';$('#goals').innerHTML=S.goals.length?S.goals.map(g=>`<div class="goal" data-id="${g.id}"><div class="goal-top"><div><div class="goal-name">${esc(g.name)}</div><small>${esc(g.why)}</small></div><b>${g.p}%</b></div><div class="bar"><i style="width:${g.p}%"></i></div><div class="goal-actions"><button class="move">+ motion</button><button class="remove">remove</button><small style="margin-left:auto;padding-top:5px">next: ${esc(g.step)}</small></div></div>`).join(''):'<div class="empty">Name a direction, even if it has no finish line.</div>';$('#doneN').textContent=done;$('#openN').textContent=S.tasks.length-done;let vows=['I will close one open loop before I open another.','I will make the next move small enough to begin.','I will protect attention from false urgency.','I will count proof of motion, not perfect plans.'];$('#vowText').textContent='“'+vows[new Date().getDate()%vows.length]+'”';save()}$('#capture').onsubmit=e=>{e.preventDefault();let v=$('#quick').value.trim();if(!v)return;let kind=/every|daily|walk|read|practice|exercise/i.test(v)?'habit':/idea|maybe|explore/i.test(v)?'possibility':'obligation';S.tasks.unshift({id:Date.now(),text:v,done:false,kind});$('#quick').value='';render()};$('#tasks').onclick=e=>{let row=e.target.closest('.item');if(!row)return;let t=S.tasks.find(x=>x.id==row.dataset.id);if(e.target.classList.contains('check'))t.done=!t.done;if(e.target.classList.contains('del'))S.tasks=S.tasks.filter(x=>x!==t);render()};$('#goals').onclick=e=>{let row=e.target.closest('.goal');if(!row)return;let g=S.goals.find(x=>x.id==row.dataset.id);if(e.target.classList.contains('move'))g.p=Math.min(100,g.p+7);if(e.target.classList.contains('remove'))S.goals=S.goals.filter(x=>x!==g);render()};$('#addGoal').onclick=()=>$('#modal').classList.add('on');$('#cancel').onclick=()=>$('#modal').classList.remove('on');$('#goalForm').onsubmit=e=>{e.preventDefault();S.goals.push({id:Date.now(),name:$('#gname').value,why:$('#gwhy').value||'A direction worth moving toward.',step:$('#gstep').value||'Choose the smallest next move',p:1});e.target.reset();$('#modal').classList.remove('on');render()};$('#note').innerText=S.note||'Make fewer promises. Keep the ones you make.';$('#note').oninput=()=>{S.note=$('#note').innerText;save()};let d=new Date();$('#date').innerHTML=d.toLocaleDateString('en-US',{weekday:'long',month:'long',day:'numeric'}).toUpperCase()+`<div class="score">${S.tasks.filter(x=>x.done).length}/${S.tasks.length} CLOSED</div>`;render();</script></body></html>
